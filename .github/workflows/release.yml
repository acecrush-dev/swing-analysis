# ──────────────────────────────────────────────────────────────────────
#  release.yml — build signed installers from an EXISTING tag, attach
#  them to a draft GitHub Release on the PUBLIC mirror repo, then
#  optionally promote draft → public on a second dispatch.
#
#  Topology (unchanged from previous version):
#    swing-analysis  (private, source-of-truth + CI) ─── PAT_PUBLIC_REPO ──▶
#    swing-analysis-app (public)
#         └─ GitHub Release v$TAG carries .dmg / .zip / .exe / .AppImage
#
#  Manual-only: this workflow no longer fires on tag push. Tag creation
#  lives in `set-version.yml`, which is the ONLY workflow that writes
#  the version/commit/tag triple to git. Release is always an explicit
#  human action.
#
#  Two ways to invoke:
#    - version empty       → picks highest semver tag on origin.
#    - version=1.2.3       → rebuilds that specific tag (re-publish path).
#  publish_final=false (default) → leaves the release as draft.
#  publish_final=true            → also promotes draft → public after upload.
#  The tag MUST already exist on origin. Refusal to auto-create stays in
#  `set-version.yml` (auto-tag at release time has burned us before).
# ──────────────────────────────────────────────────────────────────────

name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to release — "1.2.3" or "v1.2.3". Empty = highest semver tag on origin.'
        required: false
        default: ''
      publish_final:
        description: 'After upload, auto promote draft → public release?'
        type: boolean
        default: false

concurrency:
  group: release-${{ inputs.version || 'auto' }}
  cancel-in-progress: false   # partial installers are worse than slow

permissions:
  contents: read

jobs:
  resolve-tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      bare_version: ${{ steps.tag.outputs.bare }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve target tag
        id: tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git fetch --tags origin

          RAW="$INPUT_VERSION"

          if [ -z "$RAW" ]; then
            CANDIDATES="$(
              git ls-remote --tags origin \
                | awk '{print $2}' \
                | sed 's|^refs/tags/||' \
                | grep -v '\^' \
                | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' \
                || true
            )"
            TAG="$(printf '%s\n' "$CANDIDATES" | sort -V | tail -n 1)"
            if [ -z "$TAG" ]; then
              echo "::error::No semver tag found on origin (looked for vX.Y.Z)."
              echo "::error::Run 'Set version & tag' first to create one, then re-run this workflow."
              exit 1
            fi
            echo "No version supplied — picked highest tag on origin: ${TAG}."
          else
            if [[ "$RAW" == v* ]]; then
              TAG="$RAW"
              VER="${RAW#v}"
            else
              TAG="v$RAW"
              VER="$RAW"
            fi
            if ! [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::'${RAW}' is not a valid semver version (expected X.Y.Z or vX.Y.Z)"
              exit 1
            fi
            if ! git ls-remote --tags origin | grep -q "refs/tags/${TAG}$"; then
              echo "::error::Tag '${TAG}' does not exist on origin."
              echo "::error::Run 'Set version & tag' first, then re-run with version=${VER}."
              exit 1
            fi
            echo "Resolved ${RAW} → ${TAG} (exists on origin)."
          fi

          BARE="${TAG#v}"
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"
          echo "bare=${BARE}"   >> "$GITHUB_OUTPUT"

  build-linux:
    needs: resolve-tag
    runs-on: ubuntu-22.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-tag.outputs.version }}
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install --upgrade pip
      - run: pip install -r backend/requirements.txt pyinstaller

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # electron-vite bundles → out/ (gitignored; the asar's `files` entry
      # `out/**/*` is empty without this — the asar sanity check then fails
      # with `out/main/index.js was not found in this archive`).
      - name: Build app bundles (electron-vite → out/)
        run: pnpm run build

      - name: Build Python sidecar (ELF, --onefile)
        run: pnpm run bundle:py

      - name: Build Linux installers (AppImage + deb, x64)
        run: pnpm exec electron-builder --linux --x64

      - name: Collect Linux artefacts
        run: |
          mkdir -p out
          cp release/*.{deb,AppImage,blockmap} out/ 2>/dev/null || true
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: installers-linux-${{ needs.resolve-tag.outputs.bare_version }}
          path: out/

  build-windows:
    needs: resolve-tag
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      # Authenticode: present → sign, absent → skip without workflow change.
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-tag.outputs.version }}
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install --upgrade pip
      - run: pip install -r backend/requirements.txt pyinstaller

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # electron-vite bundles → out/ (gitignored; the asar's `files` entry
      # `out/**/*` is empty without this — the asar sanity check then fails
      # with `out/main/index.js was not found in this archive`).
      - name: Build app bundles (electron-vite → out/)
        run: pnpm run build

      - name: Build Python sidecar (PE32+, --onedir)
        run: pnpm run bundle:py

      - name: Build Windows installer (NSIS, x64)
        run: pnpm exec electron-builder --win --x64

      - name: Collect Windows artefacts
        shell: bash
        run: |
          mkdir -p out
          cp release/*.exe release/*.blockmap out/ 2>/dev/null || true
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: installers-windows-${{ needs.resolve-tag.outputs.bare_version }}
          path: out/

  build-mac:
    needs: resolve-tag
    runs-on: macos-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      # Apple notarization + Developer ID signing. All optional — empty
      # values make electron-builder emit unsigned artefacts (see docs 08
      # "First launch & unsigned artifacts" for the user-facing workaround).
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-tag.outputs.version }}
          lfs: true

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # electron-vite bundles → out/ (gitignored; the asar's `files` entry
      # `out/**/*` is empty without this — the asar sanity check then fails
      # with `out/main/index.js was not found in this archive`). One build
      # covers both arch passes below — out/ is arch-independent JS.
      - name: Build app bundles (electron-vite → out/)
        run: pnpm run build

      # ── Pass 1: arm64 (native Apple Silicon Python) ──
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install --upgrade pip
      - run: pip install -r backend/requirements.txt pyinstaller
      - name: Build Python sidecar (Mach-O arm64)
        run: pnpm run bundle:py
      - name: Evidence — verify arm64 Mach-O
        run: file backend/dist/swing-backend
      - name: Build macOS installers (arm64)
        run: pnpm exec electron-builder --mac --arm64
      - name: Collect arm64 artefacts
        run: |
          # Collect into dist/, NEVER out/: electron-builder packs out/**/*
          # into the asar, so any installer parked in out/ gets baked into
          # the NEXT pass's dmg. History: the original `mv release/*arm64*`
          # moved electron-builder's mac-arm64/ staging DIR (~800 MB of
          # arm64 frameworks) into out/ → x64 dmg 1.59 GB; the first fix
          # (-type f) still moved the 446 MB arm64 .dmg FILE itself into
          # out/ → x64 dmg 1.07 GB. dist/ is upload-only, asar never sees it.
          # -type f also skips release/mac-arm64/ (unpack staging dir).
          mkdir -p dist
          find release -maxdepth 1 -type f -name '*arm64*' -exec mv {} dist/ \;
          ls -la dist/
          ls -la out/

      # ── Pass 2: x64 (Rosetta-translated Python 3.12 + legacy wheels) ──
      # Belt-and-suspenders: ensure Rosetta 2 is present BEFORE setup-python.
      # macos-latest arm64 runners ship with Rosetta pre-installed, but make
      # it explicit so the failure mode is clear if the runner image ever
      # changes. Without Rosetta, `arch -x86_64 <universal2_bin>` falls back
      # to native arm64 execution (the very symptom that surfaces below as
      # "platform.machine() == arm64" — silently emitting arm64 Mach-O).
      - name: Ensure Rosetta 2 is installed (pass-2)
        run: |
          if ! arch -x86_64 /usr/bin/uname -m 2>/dev/null | grep -q x86_64; then
            softwareupdate --install-rosetta --agree-to-license || true
          fi
          arch -x86_64 uname -m | grep -q x86_64 || {
            echo "::error::Rosetta x86_64 translation unavailable — install-rosetta failed"; exit 1;
          }

      # WHY 3.12 HERE vs pass-1's 3.13 (upstream wheel constraint, not a
      # style choice): mediapipe NEVER shipped an Intel-mac cp313 wheel —
      # Intel support ended at 0.10.21 (cp312 max) — and onnxruntime
      # x86_64-mac wheels end at 1.23.2. The legacy set is selected by the
      # platform markers in backend/requirements.txt. The different minor
      # version also gives pass-2 its OWN site-packages, so it can never
      # import pass-1's arm64 wheels (the arch-contamination failure mode
      # of the 3.13/3.13 pair: pip skipped reinstalling "already satisfied"
      # arm64 numpy and PyInstaller's dlopen died on it — run 34194945012).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64

      # Early-fail guard: setup-python's macOS "x64" interpreter is a
      # python.org UNIVERSAL2 build — arm64+x86_64 dual-slice. The assertion
      # below proves both that the binary carries an x86_64 slice (file grep)
      # and that arch -x86_64 actually launches the x86_64 slice under
      # Rosetta (platform.machine() == 'x86_64'). A second setup-python call
      # does NOT displace pass-1's arm64 bin path — both passes install the
      # same universal2 binary; only arch -x86_64 below flips the runtime
      # arch, so this guard is the load-bearing step for x64 build purity.
      - name: Verify Rosetta x86_64 slice (pass-2)
        run: |
          file "$pythonLocation/bin/python3" | grep -q 'x86_64' || {
            echo "::error::$pythonLocation/bin/python3 is not universal2 (no x86_64 slice)"; exit 1;
          }
          arch -x86_64 "$pythonLocation/bin/python3" -c "import platform; m = platform.machine(); assert m == 'x86_64', f'x86_64 slice unavailable: {m}'; print('[pass2] Rosetta x86_64 ok')"

      - run: arch -x86_64 "$pythonLocation/bin/python3" -m pip install --upgrade pip
      - run: arch -x86_64 "$pythonLocation/bin/python3" -m pip install -r backend/requirements.txt pyinstaller
      - name: Build Python sidecar (Mach-O x86_64)
        # SWING_PYTHON pins the exact interpreter so PATH order can never
        # quietly resolve bundle:py to pass-1's (see resolvePy() in
        # scripts/build-python-bundle.js); SWING_PY_ARCH wraps it in
        # arch -x86_64 so PyInstaller emits an x86_64 bundle.
        run: SWING_PYTHON="$pythonLocation/bin/python3" SWING_PY_ARCH=x86_64 pnpm run bundle:py
      - name: Evidence — verify x86_64 Mach-O
        run: |
          file backend/dist/swing-backend
          file backend/dist/swing-backend | grep -q 'x86_64' || {
            echo "sidecar Mach-O is not x86_64 — pass2 PyInstaller picked the wrong interpreter"; exit 1;
          }
      # Smoke gate: mediapipe 0.10.21 on Intel/translated has never been run
      # by this repo — but the sidecar's own warmup does a REAL blank-frame
      # inference per model, so a broken graph init (the 1.0.1 Metal-delegate
      # abort class) surfaces here as a red step instead of a broken
      # installer. An arm64 runner executing the binary under Rosetta is the
      # closest proxy to an Intel Mac's CPU path that CI can offer.
      - name: Smoke — boot x86_64 sidecar under Rosetta
        run: |
          LOG=/tmp/x64-smoke.log
          ./backend/dist/swing-backend --port 18742 \
            --models-dir "$GITHUB_WORKSPACE/backend/models" \
            --data-dir /tmp/x64-smoke >"$LOG" 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 120); do
            if grep -q '\[model\] mediapipe: ready' "$LOG" \
              && grep -q '\[model\] rtmpose: ready' "$LOG" \
              && grep -q '\[model\] rtmdet: ready' "$LOG"; then
              echo "[smoke] all three models ready under x86_64 ✓"
              exit 0
            fi
            if grep -q '\[model\].*: failed' "$LOG"; then
              echo "::error::a model failed to load under x86_64 — log:"; cat "$LOG"; exit 1
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              echo "::error::sidecar exited early under x86_64 — log:"; cat "$LOG"; exit 1
            fi
            sleep 2
          done
          echo "::error::smoke timeout (240s) waiting for model warmup — log:"; cat "$LOG"; exit 1
      - name: Build macOS installers (x64)
        run: pnpm exec electron-builder --mac --x64
      - name: Collect x64 artefacts
        run: |
          mkdir -p dist
          find release -maxdepth 1 -type f -name '*x64*' -exec mv {} dist/ \;
          ls -la dist/
          # Size sentinel: the x64 dmg should be within ~1.5× of the arm64
          # one (same renderer, same models, sidecar within ~10%). Anything
          # ≥2× means an installer got baked into the asar again — fail the
          # run instead of shipping the bloat.
          ARM64_DMG=$(find dist -maxdepth 1 -type f -name '*arm64*.dmg' | head -n 1)
          X64_DMG=$(find dist -maxdepth 1 -type f -name '*x64*.dmg' | head -n 1)
          if [[ -z "$ARM64_DMG" || -z "$X64_DMG" ]]; then
            echo "::error::missing dmg in dist/ (arm64='${ARM64_DMG:-none}' x64='${X64_DMG:-none}')"; exit 1
          fi
          ARM64_MB=$(( $(stat -f%z "$ARM64_DMG") / 1048576 ))
          X64_MB=$(( $(stat -f%z "$X64_DMG") / 1048576 ))
          echo "[sentinel] arm64=${ARM64_MB}MB x64=${X64_MB}MB"
          if (( X64_MB > ARM64_MB * 2 )); then
            echo "::error::x64 dmg is ${X64_MB}MB vs arm64 ${ARM64_MB}MB (≥2×) — asar likely swallowed an installer again"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: installers-mac-${{ needs.resolve-tag.outputs.bare_version }}
          path: dist/

  publish-release:
    needs: [resolve-tag, build-linux, build-windows, build-mac]
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: dist/

      - name: Create DRAFT release on public mirror
        env:
          GH_TOKEN: ${{ secrets.PAT_PUBLIC_REPO }}
          TAG: ${{ needs.resolve-tag.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s globstar
          ls -la dist/
          ls -la dist/installers-*/

          # Upload installer FILES only. The artefacts also contain out/'s
          # main/ preload/ renderer/ subdirs (electron-vite output) — the
          # old bare `dist/installers-*/**/*` glob handed gh those
          # DIRECTORIES as assets and died with
          # "read .../preload: is a directory" (first run to ever reach
          # this step; every earlier release failed before publishing).
          assets=()
          shopt -s nullglob
          for f in dist/installers-*/**/*.{dmg,exe,AppImage,deb,blockmap,zip}; do
            [ -f "$f" ] && assets+=("$f")
          done
          shopt -u nullglob
          if [ ${#assets[@]} -eq 0 ]; then
            echo "::error::no installer assets found under dist/"; exit 1
          fi
          printf 'asset: %s\n' "${assets[@]}"

          gh release create "$TAG" \
              --repo acecrush-dev/swing-analysis-app \
              --title "AceCrush Swing-Analysis $TAG" \
              --notes "Automated draft release. Promote to public via the 'release' workflow with publish_final=true once verified." \
              --generate-notes \
              --draft \
              "${assets[@]}"

          echo "::notice::Draft release ${TAG} created: https://github.com/acecrush-dev/swing-analysis-app/releases/tag/${TAG}"

  publish:
    needs: publish-release
    runs-on: ubuntu-latest
    if: ${{ inputs.publish_final }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - name: Promote draft release → public
        env:
          GH_TOKEN: ${{ secrets.PAT_PUBLIC_REPO }}
          TAG: ${{ needs.resolve-tag.outputs.version }}
        run: |
          set -euo pipefail
          echo "Promoting draft release ${TAG} to public …"
          gh release edit "${TAG}" --repo acecrush-dev/swing-analysis-app --draft=false
          echo "::notice::Release ${TAG} is now public: https://github.com/acecrush-dev/swing-analysis-app/releases/tag/${TAG}"
