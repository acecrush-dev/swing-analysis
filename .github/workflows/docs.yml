# GitHub Pages — build & deploy the bilingual mkdocs site on every push to main.
#
# What it does:
#   1. checkout the repo
#   2. install Python deps (mkdocs + material + static-i18n)
#   3. mkdocs build (outputs English at / and Chinese at /zh/)
#   4. upload site/ as a Pages artifact + deploy via official actions/deploy-pages
#
# Uses the official GitHub Pages deploy action (recommended by GitHub) instead of
# pushing to a gh-pages branch. Requires Pages source to be "GitHub Actions".

name: docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:    # manual trigger from the Actions tab

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write   # required by actions/deploy-pages for OIDC token verification

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true   # pull the LFS-tracked ONNX models (workflow file shouldn't depend on them, but keep checkout consistent)

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install docs deps
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements-docs.txt

      - name: Build site (English + Chinese)
        run: mkdocs build --clean --strict

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4