# GitHub Pages — build & deploy the bilingual VitePress site on every
# push that touches docs/, the workflow itself, or the lockfile.
#
# Pipeline:
#   1. checkout
#   2. npm ci — reproducible install from package-lock.json
#   3. npm run docs:build — vitepress writes docs/.vitepress/dist/
#   4. configure-pages (with enablement: true on first run so private
#      repos don't need a manual Settings → Pages flip)
#   5. upload dist/ as a Pages artifact + deploy via official
#      actions/deploy-pages (recommended over pushing a gh-pages branch).
#
# Permissions: contents:read, pages:write, id-token:write (OIDC for the
# deploy action). For private repos with strict org policies, the owner
# may need to enable Pages once at the repo level (Settings → Pages →
# Build and deployment → Source = "GitHub Actions") — `enablement: true`
# covers the common case.
#
# Pin JavaScript actions to Node 24 — Node 20 is being deprecated on
# GitHub-hosted runners (2025-09-19 changelog). Setting the env on the
# job suppresses the warning + aligns the runner with the actions' own
# `engines.node` requirements.

name: docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:    # manual trigger from the Actions tab

# Cancel an in-flight deploy when a fresh commit lands; otherwise the
# previous build would race the new one and the live site would briefly
# flicker between snapshots.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Force every JavaScript action (checkout, configure-pages,
    # setup-node, …) to run on Node 24, clearing the Node 20
    # deprecation warning. Official GitHub opt-in:
    # https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build VitePress site
        run: npm run docs:build

      - name: Setup Pages
        # `enablement: true` lets the action auto-enable GitHub Pages
        # the first time it runs against a fresh repo. If your org
        # requires a manual Settings → Pages flip (paid GH plans with
        # strict page policies), this is a no-op once Pages is already
        # enabled, and the run still succeeds.
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

