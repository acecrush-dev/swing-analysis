# GitHub Pages — build & deploy the bilingual VitePress site on every
# push that touches docs/, the workflow itself, or the lockfile.
#
# Pipeline:
#   1. checkout (with full history so the deploy-pages action has ref info)
#   2. npm ci — reproducible install from package-lock.json
#   3. npm run docs:build — vitepress writes docs/.vitepress/dist/
#   4. upload that dist/ as a Pages artifact + deploy via official
#      actions/deploy-pages (recommended over pushing a gh-pages branch).
#
# Required repo setting: Settings → Pages → Source = "GitHub Actions".
# Permissions: contents:read, pages:write, id-token:write (OIDC for the
# deploy action — auto-granted by GitHub when you flip Pages to Actions
# as the source).

name: docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:    # manual trigger from the Actions tab

# Cancel an in-flight deploy when a fresh commit lands; otherwise the
# previous build would race the new one and the live site would briefly
# flicker between snapshots.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build VitePress site
        run: npm run docs:build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
