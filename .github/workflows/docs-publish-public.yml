# ──────────────────────────────────────────────────────────────────────
#  docs-publish-public.yml — build the docs site (private) and push the
#  static output to the PUBLIC mirror repo's `gh-pages` branch.
#
#  Topology:
#    swing-analysis  (private, source-of-truth + CI)
#         │
#         ▼  force-push dist/ over
#    swing-analysis-app (public)
#         │  gh-pages branch = built static site served by GH Pages
#         │  master branch   = README + nothing else
#
#  Auth: PAT_PUBLIC_REPO — a Fine-grained PAT scoped to
#  acecrush-dev/swing-analysis-app with Contents: Read and write
#  (NOT a classic token; Fine-grained can be TTL-limited).
#
#  Trigger: push to main when docs/ or this workflow file changes;
#  also manual dispatch for one-off rebuilds.
# ──────────────────────────────────────────────────────────────────────

name: docs-publish-public

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs-publish-public.yml'
  workflow_dispatch:

concurrency:
  group: docs-publish-public
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      PUBLIC_REPO_FULL: 'acecrush-dev/swing-analysis-app'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Build VitePress site
        run: npm run docs:build

      # Auth with the PAT — `actions/checkout` doesn't accept a per-repo
      # token when pushing to a *different* repo, so we shell out.
      - name: Publish to gh-pages on the public repo
        env:
          GH_TOKEN: ${{ secrets.PAT_PUBLIC_REPO }}
        run: |
          set -euo pipefail
          git config --global user.name  'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${PUBLIC_REPO_FULL}.git"

          cd ..
          rm -rf public-pages

          # ── 1. Acquire gh-pages worktree. First-ever run: the branch
          #    doesn't exist yet, so the --branch clone fails; in that
          #    case we clone the default branch, switch to a fresh
          #    --orphan gh-pages, and let the later "wipe + replace"
          #    fall through naturally.
          if git clone --depth=1 --branch=gh-pages "$REMOTE" public-pages 2>/dev/null; then
            echo "Cloned existing gh-pages branch"
          else
            echo "::notice::gh-pages branch missing on public repo — bootstrapping"
            git clone --depth=1 "$REMOTE" public-pages
            cd public-pages
            git checkout -q --orphan gh-pages
            git rm -rfq . 2>/dev/null || true
            cd ..
          fi

          cd public-pages

          # ── 2. Replace the worktree with the freshly-built dist.
          git rm -r --quiet --ignore-unmatch . || true
          cp -R ../swing-analysis/docs/.vitepress/dist/. .
          # GH Pages filters underscore-leading filenames by default; opt
          # out of Jekyll processing so .vitepress/cache-related files
          # are served as-is. (.nojekyll is harmless when the branch was
          # just bootstrapped — it's the one file we kept above.)
          touch .nojekyll

          # ── 3. Push if anything actually changed.
          if git diff --quiet HEAD; then
            echo "no changes to publish"
            exit 0
          fi

          git add -A
          git commit -m "docs: build ${GITHUB_SHA}"

          # Push; on first-ever publish the upstream gh-pages ref has
          # no upstream-tracking ref yet because we didn't clone it, so
          # git push origin HEAD:gh-pages is the safe form.
          git push origin HEAD:gh-pages
